name: Block Force Push Protection
on:
  push:
    branches: [main]
jobs:
  check-force-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for force push
        run: |
          FILE_COUNT=$(git ls-tree -r --name-only HEAD | wc -l)
          if [ "$FILE_COUNT" -lt 100 ]; then exit 1; fi
          echo OK
